<!DOCTYPE html>
<html lang="en" manifest="PSPulse.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaki OpenLine // PS4 9.00–9.60</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <style>
    :root {
      --bg: #050508;
      --panel: #080b10;
      --panel-2: #0d1218;
      --line: #15202e;
      --line-h: #1c2e42;
      --text: #d8e8f4;
      --muted: #6a86a0;
      --dim: #384858;
      --accent: #0098e8;
      --glow: #00cfff;
      --glow2: #005a9e;
      --green: #00df88;
      --red: #ff5555;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background .5s;
    }
    body.jb-success { background: #001a0a; }
    a { color: var(--accent); }

    .app {
      display: flex;
      flex-direction: column;
      flex: 1;
      margin: 0 auto;
      max-width: 900px;
      padding: 0 16px 20px;
      width: 100%;
    }

    /* ── Header ─────────────────────────────────────────── */
    .zol-hd {
      align-items: center;
      border-bottom: 1px solid var(--line-h);
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
    }
    .zol-brand { align-items: center; display: flex; gap: 10px; }
    .zol-logo { border-radius: 50%; height: 44px; object-fit: cover; width: 44px; }
    .zol-name { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .03em; line-height: 1.1; }
    .zol-name em { color: var(--glow); font-style: normal; }
    .zol-sub { color: var(--muted); font-size: 11px; letter-spacing: .1em; margin-top: 2px; text-transform: uppercase; }
    .zol-fw { text-align: right; }
    .zol-fw-lbl { color: var(--muted); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
    .zol-fw-num {
      color: var(--glow);
      font: 900 46px/1 var(--sans);
      letter-spacing: -1px;
      text-shadow: 0 0 20px var(--accent), 0 0 42px var(--glow2);
    }

    /* ── Info pills ─────────────────────────────────────── */
    .zol-info {
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px 0;
    }
    .pill {
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line-h);
      border-radius: 3px;
      color: var(--muted);
      display: inline-flex;
      font-size: 12px;
      gap: 5px;
      padding: 3px 9px;
    }
    .pill .dot { background: var(--accent); border-radius: 50%; flex-shrink: 0; height: 6px; width: 6px; }
    .pill .dg  { background: var(--green); }

    /* ── Step ───────────────────────────────────────────── */
    .zol-step {
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line-h);
      border-left: 3px solid var(--accent);
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 14px;
      transition: border-left-color .4s;
    }
    body.jb-success .zol-step { border-left-color: var(--green); }
    .step-ic { color: var(--accent); flex-shrink: 0; }
    #msgs2 { color: var(--text); font-size: 14px; }

    /* ── Status / log ───────────────────────────────────── */
    .log-wrap { margin-top: 10px; }
    .sec-lbl { color: var(--muted); font-size: 11px; letter-spacing: .15em; margin-bottom: 5px; text-transform: uppercase; }
    #notify {
      background: var(--panel-2);
      border: 1px solid var(--line-h);
      min-height: 44px;
      padding: 10px 14px;
      transition: border-left-color .3s, opacity .3s;
    }
    #notify.notification  { border-left: 3px solid var(--accent); }
    #notify.notification2 { border-left: 3px solid var(--dim); opacity: .55; }
    #log { font-size: 14px; }
    #log h1 { color: var(--text) !important; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; }
    #console { display: none !important; }

    /* ── Counters ───────────────────────────────────────── */
    .zol-meta { color: var(--muted); display: flex; font-size: 12px; gap: 14px; margin-top: 7px; }
    .zol-meta .pass { color: var(--green); }
    .zol-meta .fail { color: var(--red); }

    /* ── Success block ──────────────────────────────────── */
    #zol-done {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      padding: 28px 16px;
      text-align: center;
      border: 1px solid var(--green);
      background: rgba(0,180,80,.07);
    }
    body.jb-success #zol-done { display: flex; }
    #zol-done .done-ic {
      color: var(--green);
      font-size: 70px;
      line-height: 1;
      text-shadow: 0 0 40px var(--green);
    }
    #zol-done .done-txt {
      color: var(--green);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-top: 10px;
      text-shadow: 0 0 22px var(--green);
    }
    #zol-done .done-sub { color: var(--muted); font-size: 13px; margin-top: 8px; }

    /* ── Payloads ────────────────────────────────────────── */
    .zol-payloads { margin-top: 14px; }
    .zol-grid { display: grid; gap: 5px; grid-template-columns: repeat(4, 1fr); }
    .zol-grid button {
      background: var(--panel);
      border: 1px solid var(--line-h);
      color: var(--text);
      cursor: pointer;
      font: 13px/1.3 var(--sans);
      min-height: 40px;
      padding: 7px 10px;
      text-align: left;
    }
    .zol-grid button:hover, .zol-grid button:focus {
      background: var(--panel-2);
      border-color: var(--accent);
      color: var(--glow);
      outline: 0;
    }
    .zol-grid button:focus { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

    /* ── Footer ─────────────────────────────────────────── */
    .zol-foot { color: var(--dim); font-size: 12px; margin-top: auto; padding: 14px 0 2px; text-align: center; }
    .zol-foot a { color: var(--muted); }
    .zol-foot a:hover { color: var(--glow); }

    @media (max-width: 600px) {
      .zol-grid { grid-template-columns: repeat(2, 1fr); }
      .zol-fw-num { font-size: 34px; }
    }
  </style>
  <script>
    (function () {
      var ac = window.applicationCache;
      if (!ac) return;
      ac.addEventListener('updateready', function () { try { ac.swapCache(); } catch (e) {} }, false);
    }());
  </script>
  <script defer src="payloads.js"></script>
  <script defer src="loader.js"></script>
  <script type="module" src="alert.js"></script>
</head>

<body onload="if (window.ps4FirmwareSupported) load_exploit();">

  <div class="app">
    <header class="zol-hd">
      <div class="zol-brand">
        <img class="zol-logo" src="../logo.png" alt="">
        <div>
          <div class="zol-name">Zaki <em>OpenLine</em></div>
          <div class="zol-sub">PS4 Jailbreak Host</div>
        </div>
      </div>
      <div class="zol-fw">
        <div class="zol-fw-lbl">FIRMWARE</div>
        <div class="zol-fw-num" id="PS4fw">—</div>
      </div>
    </header>

    <div class="zol-info">
      <span class="pill"><span class="dot"></span>PSFree + Lapse</span>
      <span class="pill"><span class="dot dg"></span>GoldHEN v2.4b18.13</span>
      <span class="pill">FW 9.00–9.60</span>
    </div>

    <div class="zol-step">
      <span class="step-ic">▶</span>
      <span id="msgs2">Ready to Jailbreak</span>
    </div>

    <div class="log-wrap">
      <div class="sec-lbl">Status</div>
      <div id="notify" class="notification">
        <div id="log"></div>
      </div>
    </div>

    <div class="zol-meta">
      <span class="pass">Pass: <span id="passCounter">0</span></span>
      <span class="fail">Fail: <span id="failCounter">0</span></span>
    </div>

    <!-- Success block — shown by body.jb-success -->
    <div id="zol-done" role="status" aria-live="assertive">
      <div class="done-ic">✓</div>
      <div class="done-txt">ALL DONE</div>
      <div class="done-sub">GoldHEN v2.4b18.13 loaded — payloads available below</div>
    </div>

    <div class="zol-payloads">
      <div class="sec-lbl">Payloads</div>
      <div class="zol-grid">
        <button onclick="load_PSFreeFix()" onmouseover="document.getElementById('msgs2').textContent='PSFree Fix'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">PSFree Fix</button>
        <button onclick="load_ftp()" onmouseover="document.getElementById('msgs2').textContent='FTP Server'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">FTP Server</button>
        <button onclick="load_ps4debug()" onmouseover="document.getElementById('msgs2').textContent='PS4Debug'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">PS4Debug</button>
        <button onclick="load_app2usb()" onmouseover="document.getElementById('msgs2').textContent='App2USB'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">App2USB</button>
        <button onclick="load_backup()" onmouseover="document.getElementById('msgs2').textContent='Backup'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">Backup</button>
        <button onclick="load_restore()" onmouseover="document.getElementById('msgs2').textContent='Restore'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">Restore</button>
        <button onclick="load_disable_updates()" onmouseover="document.getElementById('msgs2').textContent='Disable Updates'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">Disable Updates</button>
        <button onclick="load_enable_updates()" onmouseover="document.getElementById('msgs2').textContent='Enable Updates'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">Enable Updates</button>
        <button onclick="load_appcache_install()" onmouseover="document.getElementById('msgs2').textContent='AppCache Install'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">AppCache Install</button>
        <button onclick="load_history_blocker()" onmouseover="document.getElementById('msgs2').textContent='History Blocker'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">History Blocker</button>
        <button onclick="load_pup_decrypt()" onmouseover="document.getElementById('msgs2').textContent='PUP Decrypt'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">PUP Decrypt</button>
        <button onclick="load_rif_renamer()" onmouseover="document.getElementById('msgs2').textContent='RIF Renamer'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">RIF Renamer</button>
        <button onclick="load_webrte()" onmouseover="document.getElementById('msgs2').textContent='WebRTE'" onmouseout="document.getElementById('msgs2').textContent='Ready to Jailbreak'">WebRTE</button>
      </div>
    </div>

    <footer class="zol-foot">by <a href="https://t.me/PlayStation_Pulse">PlayStation Pulse</a></footer>
  </div>

  <script>
    /* Firmware detection — original logic preserved exactly */
    UA = navigator.userAgent.substring(navigator.userAgent.indexOf("6.72 (") + 28, navigator.userAgent.indexOf(") Apple"));
    if (UA == "layStation 4/9.00") UA = "9.00";
    if (UA == "layStation 4/9.03") UA = "9.03";
    if (UA == "layStation 4/9.04") UA = "9.04";
    if (UA == "layStation 4/9.50") UA = "9.50";
    if (UA == "layStation 4/9.51") UA = "9.51";
    if (UA == "layStation 4/9.60") UA = "9.60";
    if (UA == "layStation 4/99.99") UA = "99.99";
    var supportedFW = ["9.00", "9.03", "9.04", "9.50", "9.51", "9.60", "99.99"];
    window.ps4FirmwareSupported = supportedFW.indexOf(UA) !== -1;
    if (!window.ps4FirmwareSupported) alert("This Is For PS4 FW 9.xx Only!");
    document.getElementById("PS4fw").innerHTML = "" + UA + "";
    try {
      if (localStorage.passcount == null || localStorage.passcount == undefined) localStorage.passcount = 0;
      if (localStorage.failcount == null || localStorage.failcount == undefined) localStorage.failcount = 0;
      if (document.getElementById("passCounter")) document.getElementById("passCounter").innerHTML = localStorage.passcount;
      if (document.getElementById("failCounter")) document.getElementById("failCounter").innerHTML = localStorage.failcount;
    } catch (e) {}

    /* Success detection via MutationObserver on #log */
    (function () {
      var log = document.getElementById('log');
      if (!log || !window.MutationObserver) return;
      var ob = new MutationObserver(function () {
        var t = log.innerHTML;
        if (t.indexOf('Success') !== -1 || t.indexOf('already Loaded') !== -1) {
          document.body.classList.add('jb-success');
          ob.disconnect();
        }
      });
      ob.observe(log, { childList: true, subtree: true, characterData: true });
    }());
  </script>
</body>
</html>
