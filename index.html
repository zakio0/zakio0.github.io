<!DOCTYPE html>
<html lang="en" manifest="navigation.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSPULSE // loading</title>
  <style>
    :root {
      --bg: #151515;
      --accent: #a294ff;
      --dim: #828282;
      --text: #f5f5f5;
      --red: #ff9b9b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 Consolas, "Liberation Mono", monospace;
      min-height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #wrap { text-align: center; max-width: 480px; padding: 0 20px; }
    #brand { color: var(--accent); font-size: 18px; letter-spacing: .15em; margin-bottom: 24px; }
    #msg   { color: var(--text);   font-size: 15px; }
    #sub   { color: var(--dim);    font-size: 13px; margin-top: 10px; min-height: 1.5em; }
    #err   { color: var(--red);    font-size: 14px; margin-top: 14px; display: none; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="brand">PSPULSE</div>
    <div id="msg">detecting firmware...</div>
    <div id="sub"></div>
    <div id="err"></div>
  </div>

  <script>
    var sub = document.getElementById('sub');
    var msg = document.getElementById('msg');
    var err = document.getElementById('err');

    /* ── Firmware detection ──────────────────────────────────────────────── */
    function getPS4Firmware() {
      var ua = navigator.userAgent;
      /* Must be a PS4, not a PS5. */
      if (!/PlayStation 4/i.test(ua) || /PlayStation 5/i.test(ua)) return null;
      /* UA format: "... PlayStation 4 X.XX ..." or "... PlayStation 4/X.XX ..." */
      var m = ua.match(/PlayStation\s*4[\s\/](\d+)\.(\d+)/i);
      if (!m) return null;
      return { major: parseInt(m[1], 10), minor: parseInt(m[2], 10) };
    }

    /* ── Routing ─────────────────────────────────────────────────────────── */
    var fw = getPS4Firmware();

    function redirect(dest) {
      /* location.href preserves the referrer on the destination page,
         which is required by the afterglow referrer guard in jb.js. */
      window.location.href = dest;
    }

    if (!fw) {
      /* Not a PS4 (desktop browser, PS5, unknown) → original PSPulse site. */
      redirect('https://psx8.github.io');
    } else {
      var fwStr = fw.major + '.' + (fw.minor < 10 ? '0' + fw.minor : fw.minor);
      msg.textContent = '[ ok ] PS4 FW ' + fwStr + ' detected';

      if (fw.major === 9 && fw.minor <= 60) {
        /* ── FW 9.00–9.60 ── PSFree + Lapse */
        sub.textContent = 'loading 9.xx host...';
        redirect('900/index.html');

      } else if (fw.major === 10 || (fw.major === 11 && fw.minor <= 2)) {
        /* ── FW 10.xx and 11.00–11.02 ── CSSFontFace UAF
             css/latest/ carries GoldHEN b18.12 and handles its own AppCache. */
        sub.textContent = 'loading 10.xx/11.0x host...';
        redirect('css/latest/index.html');

      } else if (fw.major >= 11 && fw.major <= 14) {
        /* ── FW 11.50–14.00 ── afterglow / SlopKit WebKit UAF */
        sub.textContent = 'loading 11.50-14.00 host...';
        redirect('1400/index.html');

      } else {
        /* Out of supported range (< 9.00 or > 14.00). */
        msg.textContent = '[ -- ] FW ' + fwStr + ' not supported';
        err.style.display = 'block';
        err.innerHTML =
          'Firmware ' + fwStr + ' has no supported exploit on this host.<br>' +
          'Visit <a href="https://psx8.github.io" style="color:var(--accent)">psx8.github.io</a> for other options.';
      }
    }
  </script>
</body>
</html>
