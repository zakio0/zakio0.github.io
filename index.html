<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>《 Z@ki OpenLine 》 PS4 Jailbreak by HoussamLovy</title>
  <style>
    :root {
      --bg:     #07090c;
      --panel:  rgba(15,19,25,.84);
      --border: rgba(255,255,255,.072);
      --text:   #eef2f7;
      --muted:  #87919e;
      --green:  #69e59a;
      --yellow: #e4c66f;
      --red:    #e17d78;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -15%, rgba(70,110,255,.14), transparent 42%),
        radial-gradient(circle at 10%  80%, rgba(50,210,130,.07), transparent 36%),
        var(--bg);
      color: var(--text);
      font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: hidden;
      padding-top:  env(safe-area-inset-top,  0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #app {
      width: min(500px, 100%);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ─────────────────────────────────── */
    #brand { text-align: center; margin-bottom: 16px; }

    #logo {
      width: 200px; height: 200px;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      margin: 0 auto 12px;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 0 0 1px rgba(255,255,255,.024), 0 14px 40px rgba(0,0,0,.52);
    }

    #title {
      margin: 0 0 16px;
      font-size: 32px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    /* ── BIG FW BADGE ───────────────────────────── */
    #fwBadge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 10px 24px;
      border-radius: 18px;
      background: rgba(105,229,154,.065);
      border: 1px solid rgba(105,229,154,.22);
      box-shadow:
        0 0 26px rgba(105,229,154,.16),
        0 0 52px rgba(105,229,154,.06),
        inset 0 1px 0 rgba(105,229,154,.12);
      margin-bottom: 20px;
    }

    #fwValue {
      font-size: 36px;
      font-weight: 900;
      color: var(--green);
      text-shadow:
        0 0 16px rgba(105,229,154,.8),
        0 0 34px rgba(105,229,154,.35);
      letter-spacing: .05em;
      line-height: 1;
    }

    #fwStatus {
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(105,229,154,.10);
      border: 1px solid rgba(105,229,154,.24);
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    #subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    /* ── MAIN PANEL ─────────────────────────────── */
    #panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 22px 65px rgba(0,0,0,.44),
        inset 0 1px 0 rgba(255,255,255,.024);
      backdrop-filter: blur(14px);
    }

    /* ── STATE BOX ──────────────────────────────── */
    #stateBox {
      padding: 15px 18px 13px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.013);
    }

    #state {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: .03em;
    }

    #state.ok   { color: var(--green);  }
    #state.bad  { color: var(--red);    }
    #state.warn { color: var(--yellow); }

    #statusDot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--yellow);
      box-shadow: 0 0 12px rgba(228,198,111,.5);
      transition: background .4s, box-shadow .4s;
    }

    #state.bad  #statusDot { background: var(--red);   box-shadow: 0 0 12px rgba(225,125,120,.55), 0 0 24px rgba(225,125,120,.25); }
    #state.ok   #statusDot { background: var(--green); box-shadow: 0 0 12px rgba(105,229,154,.65), 0 0 24px rgba(105,229,154,.28); }

    #det { margin-top: 6px; color: var(--muted); font-size: 11px; padding-left: 19px; }
    #det b { color: var(--text); font-weight: 650; }

    /* ── INFO ROWS ──────────────────────────────── */
    .infoRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 18px;
      border-bottom: 1px solid rgba(255,255,255,.042);
    }

    .infoLabel { color: var(--muted); font-size: 12px; }
    .infoValue { font-size: 12px; font-weight: 650; }
    .ok  { color: var(--green); }
    .bad { color: var(--red);   }

    /* ── CACHE BOX ──────────────────────────────── */
    #cacheBox { padding: 10px 18px; color: var(--muted); font-size: 11px; min-height: 16px; }
    #cache.cacheok { color: var(--green); }

    /* ── FOOTER ─────────────────────────────────── */
    #footer {
      text-align: center;
      margin-top: 14px;
      color: #4a5560;
      font-size: 9px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      #logo { width: 90px; height: 90px; border-radius: 20px; }
      #title { font-size: 22px; }
      #fwBadge { padding: 8px 16px; gap: 10px; }
      #fwValue { font-size: 28px; }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- Header -->
    <div id="brand">
      <img id="logo" src="logo_raw.png" alt="Z@ki OpenLine">
      <h1 id="title">《 Z@ki OpenLine 》</h1>

      <div id="fwBadge">
        <div id="fwValue">--.--</div>
        <div id="fwStatus">DETECTING</div>
      </div>

      <div id="subtitle">PS4 Offline Host &middot; edited by Houssam Lovy</div>
    </div>

    <main id="panel">

      <div id="stateBox">
        <div id="state">
          <span id="statusDot"></span>
          detecting firmware...
        </div>
        <div id="det"></div>
      </div>

      <div class="infoRow">
        <span class="infoLabel">Exploit Chain</span>
        <span class="infoValue" id="chainValue">Detecting...</span>
      </div>

      <div class="infoRow">
        <span class="infoLabel">Host Mode</span>
        <span class="infoValue ok">LOCAL / OFFLINE</span>
      </div>

      <div class="infoRow">
        <span class="infoLabel">Payload</span>
        <span class="infoValue ok">GoldHEN (auto)</span>
      </div>

      <div id="cacheBox">
        <span id="cache">Checking application cache...</span>
      </div>

    </main>

    <div id="footer">《 Z@ki OpenLine 》 &middot; Local PS4 Host edited by Houssam Lovy</div>
  </div>

  <script>
  (function () {
    var stateEl     = document.getElementById("state");
    var detEl       = document.getElementById("det");
    var cacheEl     = document.getElementById("cache");
    var fwValue     = document.getElementById("fwValue");
    var fwStatus    = document.getElementById("fwStatus");
    var chainValue  = document.getElementById("chainValue");
    var statusDotEl = document.getElementById("statusDot");

    function setState(t, c) {
      stateEl.innerHTML = '<span id="statusDot"></span>' + t;
      stateEl.className = c || "";
    }
    function setCache(t, ok) {
      cacheEl.textContent = t;
      cacheEl.className   = ok ? "cacheok" : "";
    }

    /* ── Firmware detection ──────────────────────── */
    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;

    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
      var minor = parseInt(m[2], 16);
      var ms    = minor.toString(16);
      if (ms.length < 2) ms = "0" + ms;
      key   = m[1] + "." + ms;
      fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    /* ── Supported firmware tables ───────────────── */
    // FW below 9.00 is not supported by this host
    var PSFREE   = {900:1, 903:1, 904:1, 950:1, 951:1, 960:1};          // PSFree    9.00-9.60
    var CSSKERN  = {1000:1, 1001:1, 1050:1, 1051:1};                    // CSSKern  10.00-10.50
    var LAPSE    = {1100:1, 1150:1, 1152:1, 1200:1, 1202:1};            // Lapse   11.00-12.02
    var POOPS    = {1250:1, 1252:1, 1300:1};                             // Poops   12.50-13.00
    var SLOP     = {1302:1, 1304:1, 1350:1, 1352:1};                    // Slop    13.02-13.52

    /* ── Chain selection ─────────────────────────── */
    var chain = null, chainName = "NONE", why = "";
    var forced = params.get("bug");

    if (forced === "psfree" || forced === "css" || forced === "lapse" || forced === "poops" || forced === "slop") {
      chain     = forced;
      chainName = forced.toUpperCase();
      why       = "forced via ?bug=" + forced;
    } else if (!key) {
      why = "user-agent is not a PlayStation 4";
    } else if (fwnum < 900) {
      why = key + " — firmware too old (minimum 9.00)";
    } else if (PSFREE[fwnum]) {
      chain = "psfree"; chainName = "PSFREE";
      why   = key + " → PSFree exploit";
    } else if (CSSKERN[fwnum]) {
      chain = "css"; chainName = "CSSKERN";
      why   = key + " → CSSFontFace exploit";
    } else if (LAPSE[fwnum]) {
      chain = "lapse"; chainName = "LAPSE";
      why   = key + " → Lapse exploit";
    } else if (POOPS[fwnum]) {
      chain = "poops"; chainName = "POOPS";
      why   = key + " → Poops exploit";
    } else if (SLOP[fwnum]) {
      chain = "slop"; chainName = "SLOP";
      why   = key + " → SlopKit exploit";
    } else {
      why = key + " — no exploit available for this firmware";
    }

    /* ── Display ─────────────────────────────────── */
    fwValue.textContent    = key || "--.--";
    chainValue.textContent = chain ? chainName : "UNSUPPORTED";

    detEl.innerHTML =
      "Firmware <b>" + (key || "unknown") + "</b> &middot; " +
      (chain ? "Chain <b>" + chainName + "</b> &middot; " : "") + why;

    /* ── Unsupported ─────────────────────────────── */
    if (!chain) {
      fwStatus.textContent         = "UNSUPPORTED";
      fwStatus.style.color         = "var(--red)";
      fwStatus.style.borderColor   = "rgba(225,125,120,.2)";
      fwStatus.style.background    = "rgba(225,125,120,.07)";
      chainValue.style.color       = "var(--red)";
      setState("UNSUPPORTED FIRMWARE", "bad");
      return;
    }

    /* ── Supported ───────────────────────────────── */
    fwStatus.textContent = "SUPPORTED";

    var TARGET_MAP = {
      psfree: "run_psfree.html",
      css:    "css/run_css.html",
      lapse:  "run_lapse.html",
      poops:  "run_poops.html",
      slop:   "run_slop.html"
    };
    var target = TARGET_MAP[chain] + location.search;

    function go() {
      setState("loading " + chainName + " chain...", "warn");
      location.replace(target);
    }

    function waitForTap(msg, action) {
      setState(msg, "warn");
      var done = false;
      function fire() {
        if (done) return;
        done = true;
        window.removeEventListener("click",   fire);
        window.removeEventListener("keydown", fire);
        action();
      }
      window.addEventListener("click",   fire);
      window.addEventListener("keydown", fire);
      window.setTimeout(fire, 2000);   // auto-fire after 2 s
    }

    /* ── Application Cache ───────────────────────── */
    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
      setCache("application cache unavailable");
      setState("READY", "ok");
      go();

    } else if (!navigator.onLine) {
      setCache("offline — loading from cache", true);
      setState("READY", "ok");
      go();

    } else if (ac.status === ac.IDLE) {
      setCache("cached — verifying...");
      setTimeout(function () {
        if (ac.status === ac.CHECKING || ac.status === ac.DOWNLOADING) {
          setCache("update found — downloading...");
          waitForDownload();
        } else if (ac.status === ac.UPDATEREADY) {
          try { ac.swapCache(); } catch (e) {}
          setCache("update downloaded", true);
          waitForTap("UPDATE READY — tap or press X to reload",
            function () { location.reload(); });
        } else {
          setCache("cached — offline ready", true);
          setState("READY", "ok");
          go();
        }
      }, 3000);

    } else if (ac.status === ac.UPDATEREADY) {
      try { ac.swapCache(); } catch (e) {}
      setCache("update downloaded", true);
      waitForTap("UPDATE READY — tap or press X to reload",
        function () { location.reload(); });

    } else {
      waitForDownload();
    }

    function waitForDownload() {
      setCache("checking application cache...");

      ac.addEventListener("downloading", function () {
        setCache("caching files for offline use (first run)...");
      }, false);

      ac.addEventListener("progress", function (e) {
        if (e && e.total)
          setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
      }, false);

      ac.addEventListener("cached", function () {
        setCache("all files cached — offline ready", true);
        setState("READY", "ok");
        waitForTap("CACHED — tap or press X to launch", go);
      }, false);

      ac.addEventListener("updateready", function () {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY — tap or press X to reload",
          function () { location.reload(); });
      }, false);

      ac.addEventListener("noupdate", function () {
        setCache("cached — offline ready", true);
        setState("READY", "ok");
        go();
      }, false);

      ac.addEventListener("error", function () {
        setCache("cache unavailable");
        waitForTap("CACHE FAILED — tap or press X to run anyway", go);
      }, false);

      ac.addEventListener("obsolete", function () {
        setCache("cache obsolete");
        waitForTap("CACHE OBSOLETE — tap or press X to run", go);
      }, false);
    }

  })();
  </script>
</body>
</html>
