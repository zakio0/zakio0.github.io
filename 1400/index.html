<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaki OpenLine // FW 11.50–14.00</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <style>
    :root {
      --bg: #050508;
      --panel: #080b10;
      --line: #1c2e42;
      --text: #d8e8f4;
      --muted: #6a86a0;
      --dim: #384858;
      --accent: #0098e8;
      --glow: #00cfff;
      --glow2: #005a9e;
      --green: #00df88;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); min-height: 100%; }
    body { align-items: center; display: flex; justify-content: center; min-height: 100vh; }

    .wrap { max-width: 420px; padding: 24px 20px; text-align: center; width: 100%; }

    .zol-logo-img { border-radius: 50%; height: 56px; object-fit: cover; width: 56px; margin-bottom: 10px; }
    .zol-name { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .03em; }
    .zol-name em { color: var(--glow); font-style: normal; }
    .zol-sub { color: var(--muted); font-size: 11px; letter-spacing: .1em; margin-bottom: 24px; text-transform: uppercase; }

    .fw-badge {
      color: var(--glow);
      font: 900 56px/1 var(--sans);
      letter-spacing: -1px;
      text-shadow: 0 0 24px var(--accent), 0 0 48px var(--glow2);
      margin-bottom: 4px;
    }
    .fw-label { color: var(--muted); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 20px; }

    .status-line {
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      text-align: left;
      margin-top: 10px;
    }
    .status-line .ic { color: var(--accent); flex-shrink: 0; }
    #line2 { color: var(--muted); font-size: 13px; }

    .prog {
      background: var(--line);
      border-radius: 2px;
      height: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .prog-bar {
      background: linear-gradient(90deg, var(--accent), var(--glow));
      border-radius: 2px;
      height: 100%;
      transition: width .3s;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="zol-logo-img" src="../logo.png" alt="">
    <div class="zol-name">Zaki <em>OpenLine</em></div>
    <div class="zol-sub">PS4 Jailbreak Host</div>

    <div class="fw-badge" id="fw-num">—</div>
    <div class="fw-label">Firmware Detected</div>

    <div class="status-line">
      <span class="ic">▶</span>
      <span id="line2">preparing cache...</span>
    </div>
    <div class="prog"><div class="prog-bar" id="prog-bar"></div></div>
  </div>

  <script>
    var DEST = 'jb.html?log=1&afterglow=run&mode=goldhen';
    var line2  = document.getElementById('line2');
    var bar    = document.getElementById('prog-bar');
    var fwNum  = document.getElementById('fw-num');
    var redirected = false;

    /* Show detected FW in the badge */
    (function () {
      var m = navigator.userAgent.match(/PlayStation\s*4[\s\/](\d+\.\d+)/i);
      if (m) fwNum.textContent = m[1];
    }());

    function go() {
      if (redirected) return;
      redirected = true;
      line2.textContent = 'loading exploit...';
      bar.style.width = '100%';
      window.location.href = DEST;
    }

    var appCache = null;
    try { appCache = window.applicationCache; } catch (e) {}

    if (!appCache) { go(); }
    else {
      var watchdog = setTimeout(function () { if (!redirected) go(); }, 90000);
      function clearWd() { clearTimeout(watchdog); }

      appCache.addEventListener('noupdate',    function () { clearWd(); go(); }, false);
      appCache.addEventListener('cached',      function () { clearWd(); line2.textContent = 'cache ready — loading...'; bar.style.width = '100%'; setTimeout(function () { window.location.reload(); }, 500); }, false);
      appCache.addEventListener('updateready', function () { clearWd(); try { appCache.swapCache(); } catch (e) {} line2.textContent = 'cache updated — loading...'; bar.style.width = '100%'; setTimeout(function () { window.location.reload(); }, 500); }, false);
      appCache.addEventListener('error',       function () { clearWd(); go(); }, false);
      appCache.addEventListener('obsolete',    function () { clearWd(); go(); }, false);
      appCache.addEventListener('progress', function (e) {
        if (redirected) return;
        if (e && e.total > 0) {
          var pct = Math.round(e.loaded / e.total * 100);
          bar.style.width = pct + '%';
          line2.textContent = 'caching ' + pct + '%';
        } else {
          line2.textContent = 'caching files...';
        }
      }, false);
      appCache.addEventListener('downloading', function () {
        if (!redirected) line2.textContent = 'caching files...';
      }, false);

      try {
        var s = appCache.status;
        if      (s === appCache.IDLE)         {
          /* IDLE means the current cache is usable; it does not mean the
             manifest check for this visit has finished. Force the check and
             wait for noupdate/updateready before launching the exploit. */
          line2.textContent = 'checking for host updates...';
          try { appCache.update(); } catch (e) { clearWd(); go(); }
        }
        else if (s === appCache.UPDATEREADY)  { clearWd(); try { appCache.swapCache(); } catch (e) {} go(); }
        else if (s === appCache.UNCACHED || s === appCache.CHECKING || s === appCache.DOWNLOADING) {
          line2.textContent = 'caching files...';
        }
        else { clearWd(); go(); }
      } catch (e) { clearWd(); go(); }
    }
  </script>
</body>
</html>
