<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>《 Z@ki OpenLine 》 — PSFree chain</title>
  <style>
    :root {
      --bg:             #07090c;
      --panel:          rgba(14,18,24,.9);
      --border:         rgba(255,255,255,.07);
      --text:           #edf1f6;
      --muted:          #7f8996;
      --green:          #69e59a;
      --yellow:         #e4c66f;
      --red:            #e17d78;
      --console:        #060a0e;
      --console-border: #1a2230;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% -15%, rgba(70,110,255,.12), transparent 45%), radial-gradient(circle at 5% 90%, rgba(50,210,130,.055), transparent 35%), var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
    body { height: 100vh; padding: 14px 18px; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    #app { width: min(980px, 100%); height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    #brand { display: flex; align-items: center; gap: 14px; padding: 0 0 12px; flex: 0 0 auto; }
    #brand img { width: 110px; height: 110px; object-fit: cover; border-radius: 20px; border: 1px solid rgba(255,255,255,.13); box-shadow: 0 6px 22px rgba(0,0,0,.44); flex: 0 0 auto; }
    #brandText { flex: 1; min-width: 0; }
    #brandTitle { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .05em; white-space: nowrap; }
    #brandSub { margin-top: 3px; margin-left: 4px; color: var(--muted); font-size: 13px; letter-spacing: .07em; }
    #fwWrap { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; padding: 8px 20px; border-radius: 16px; background: rgba(105,229,154,.065); border: 1px solid rgba(105,229,154,.24); box-shadow: 0 0 22px rgba(105,229,154,.16), 0 0 44px rgba(105,229,154,.06), inset 0 1px 0 rgba(105,229,154,.12); }
    .fw-lbl { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    #firmware { font-size: 26px; font-weight: 900; color: var(--green); text-shadow: 0 0 14px rgba(105,229,154,.8), 0 0 30px rgba(105,229,154,.35); letter-spacing: .06em; line-height: 1; }
    #panel { display: flex; flex-direction: column; overflow: hidden; flex: 1 1 auto; min-height: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 25px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.022); backdrop-filter: blur(14px); }
    #statusBar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.015); flex: 0 0 auto; transition: background .45s, border-color .45s, box-shadow .45s; }
    #statusBar.status-ok  { background: linear-gradient(135deg, rgba(28,155,76,.30) 0%, rgba(45,195,105,.16) 100%); border-bottom-color: rgba(105,229,154,.48); box-shadow: 0 4px 32px rgba(105,229,154,.18); }
    #statusBar.status-bad { background: linear-gradient(135deg, rgba(175,38,38,.30) 0%, rgba(215,58,58,.16) 100%); border-bottom-color: rgba(225,125,120,.48); box-shadow: 0 4px 32px rgba(225,125,120,.18); }
    #stateWrap { display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; }
    #statusDot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 12px rgba(228,198,111,.55); transition: background .45s, box-shadow .45s; }
    #statusBar.status-ok  #statusDot { background: var(--green); box-shadow: 0 0 10px rgba(105,229,154,.95), 0 0 24px rgba(105,229,154,.45); }
    #statusBar.status-bad #statusDot { background: var(--red);   box-shadow: 0 0 10px rgba(225,125,120,.95), 0 0 24px rgba(225,125,120,.45); }
    #state { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .35s; }
    #statusBar.status-ok  #state { color: var(--green); }
    #statusBar.status-bad #state { color: var(--red); }
    #chainBadge { padding: 5px 13px; border-radius: 999px; color: var(--green); background: rgba(105,229,154,.07); border: 1px solid rgba(105,229,154,.18); font-size: 11px; font-weight: 700; letter-spacing: .14em; flex: 0 0 auto; }
    #consoleHeader { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; background: #0b0f14; border-bottom: 1px solid var(--console-border); flex: 0 0 auto; }
    #consoleTitle  { color: #8a96a3; font: 11px/1 Consolas, "Courier New", monospace; letter-spacing: .07em; }
    #consoleStatus { color: #444f5c; font: 10px/1 Consolas, "Courier New", monospace; }
    #console { position: relative; padding: 10px; background: var(--console); flex: 1 1 auto; min-height: 0; }
    #out { height: 100%; min-height: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 Consolas, "Courier New", monospace; color: #00ff00; background: linear-gradient(rgba(255,255,255,.009) 1px, transparent 1px); background-size: 100% 3px; border: 1px solid var(--console-border); border-radius: 10px; padding: 12px 14px; overflow-y: auto; box-shadow: inset 0 0 35px rgba(0,0,0,.38); }
    #out::-webkit-scrollbar { width: 6px; }
    #out::-webkit-scrollbar-track { background: transparent; }
    #out::-webkit-scrollbar-thumb { background: #22303e; border-radius: 10px; }
    #footer { text-align: center; padding: 8px 0 0; color: #3e4c59; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; flex: 0 0 auto; }
    .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--yellow); }
  </style>
</head>

<body>
  <div id="app">
    <header id="brand">
      <img src="logo_raw.png" alt="Z@ki OpenLine">
      <div id="brandText">
        <h1 id="brandTitle">《 Z@ki OpenLine 》</h1>
        <div id="brandSub">PS4 PSFree Exploit Host &nbsp;&middot;&nbsp; by Houssam Lovy</div>
      </div>
      <div id="fwWrap">
        <span class="fw-lbl">PS4 FW</span>
        <span id="firmware">--.--</span>
      </div>
    </header>

    <main id="panel">
      <div id="statusBar">
        <div id="stateWrap">
          <span id="statusDot"></span>
          <div id="state">loading psfree chain...</div>
        </div>
        <div id="chainBadge">PSFREE</div>
      </div>

      <div id="consoleHeader">
        <div id="consoleTitle">Z@ki // PSFREE chain — GoldHEN auto-load</div>
        <div id="consoleStatus">LIVE</div>
      </div>

      <div id="console">
        <div id="out"></div>
      </div>
    </main>

    <footer id="footer">《 Z@ki OpenLine 》 &middot; Local PS4 Host edited by Houssam Lovy</footer>
  </div>

  <!--
    ╔══════════════════════════════════════════════════════════════════════╗
    ║  Z@ki PSFree Log Bridge                                             ║
    ║  This INLINE script runs BEFORE any ES module is evaluated.         ║
    ║  PSFree's module/utils.js captures `print` at module-eval time:     ║
    ║      export const log = print;                                      ║
    ║  By overriding window.print here we redirect every log() call from  ║
    ║  psfree.js / lapse.js into the Z@ki #out console automatically.     ║
    ╚══════════════════════════════════════════════════════════════════════╝
  -->
  <script>
  (function () {
    var outEl     = document.getElementById("out");
    var stateEl   = document.getElementById("state");
    var statusBar = document.getElementById("statusBar");
    var firmware  = document.getElementById("firmware");

    /* FW display */
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
      var minor = parseInt(m[2], 16);
      firmware.textContent = m[1] + "." + minor.toString(16).padStart(2, "0");
    }

    /* Append a line to the Z@ki green console */
    function appendLog(msg) {
      var line = String(msg === undefined ? "" : msg);
      var cur  = outEl.textContent;
      outEl.textContent = cur + (cur ? "\n" : "") + line;
      outEl.scrollTop   = outEl.scrollHeight;
      updateStatus();
    }

    /* Update the status bar colour from console content */
    function updateStatus() {
      var text = outEl.textContent;
      var ok   = /GoldHEN|goldhen|JAILBROKEN|payload.running|toogle_payload/i.test(text);
      var bad  = /\bFAILED\b|REBOOT REQUIRED|Error:|DieError/i.test(text);
      statusBar.classList.toggle("status-ok",  ok  && !bad);
      statusBar.classList.toggle("status-bad", bad);
      if (ok && !bad) {
        stateEl.textContent = "JAILBROKEN \u2014 GoldHEN loaded";
        stateEl.style.color = "var(--green)";
      } else if (bad) {
        stateEl.textContent = "exploit failed \u2014 reboot and retry";
        stateEl.style.color = "var(--red)";
      }
    }

    /* ── Override PS4's print() ─────────────────────
       psfree/module/utils.js does:
           export const log = print;
       Overriding window.print BEFORE module evaluation causes log()
       to write here instead of the PS4's native debug output.
    ────────────────────────────────────────────────── */
    window.print = appendLog;

    /* Redirect alert() (used by psfree/alert.js for unhandled errors) */
    window.alert = function (msg) {
      appendLog("[ALERT] " + String(msg));
    };

    /* Mock the failCounter element that psfree/module/utils.js writes to */
    var _failN = 0;
    window.failCounter = {
      get innerHTML() { return _failN; },
      set innerHTML(v) {
        _failN = v;
        appendLog("[FAIL] attempt #" + v);
        statusBar.classList.add("status-bad");
      }
    };

    /* Ensure localStorage counters exist (die() increments these) */
    try {
      if (!localStorage.failcount || isNaN(+localStorage.failcount)) localStorage.failcount = 0;
      if (!localStorage.passcount || isNaN(+localStorage.passcount)) localStorage.passcount = 0;
    } catch (e) {}

    /* Expose appendLog globally so any inline calls can reach the console */
    window.zakiLog = appendLog;

  })();
  </script>

  <!--
    The module script below is evaluated AFTER the inline bridge above.
    alert.js does: import('./psfree.js')
    psfree.js does: import { log } from './module/utils.js'
    utils.js does:  export const log = print   ← picks up our override
    All log() calls therefore flow into appendLog() → #out console.
    
    Path: psfree/alert.js  (relative to this page)
          → psfree/psfree.js
            → psfree/module/utils.js  (log = window.print = appendLog)
            → psfree/module/...
            → psfree/config.js
          → psfree/lapse.js
            → psfree/lapse/900.js  (offsets per FW)
            → psfree/rop/900.js
            → psfree/goldhen.bin   (auto-loaded by lapse.js)
  -->
  <script type="module" src="./psfree/alert.js"></script>

</body>
</html>
