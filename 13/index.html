<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>《 Z@ki OpenLine 》 PS4 Jailbreak by HoussamLovy</title>

<style>
  :root {
    --bg: #07090c;
    --panel: rgba(15, 19, 25, .82);
    --panel2: rgba(19, 24, 31, .72);
    --border: rgba(255,255,255,.075);
    --text: #eef2f7;
    --muted: #87919e;
    --green: #69e59a;
    --green2: #36c978;
    --yellow: #e4c66f;
    --red: #e17d78;
    --blue: #78a9ff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% -15%, rgba(70, 110, 255, .13), transparent 42%),
      radial-gradient(circle at 10% 80%, rgba(50, 210, 130, .06), transparent 35%),
      var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #app {
    width: min(520px, 100%);
  }

  /* Header */

  #brand {
    text-align: center;
    margin-bottom: 22px;
  }

  #logo {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border-radius: 22px;
    display: block;
    margin: 0 auto 14px;

    border: 1px solid rgba(255,255,255,.12);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.025),
      0 14px 45px rgba(0,0,0,.5);
  }

  #title {
    margin: 0;
    font-size: 27px;
    line-height: 1.1;
    font-weight: 750;
    letter-spacing: .04em;
  }

  #subtitle {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  /* Main panel */

  #panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;

    box-shadow:
      0 24px 70px rgba(0,0,0,.42),
      inset 0 1px 0 rgba(255,255,255,.025);

    backdrop-filter: blur(14px);
  }

  /* Main state */

  #stateBox {
    text-align: center;
    padding: 6px 0 20px;
  }

  #statusDot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    background: var(--yellow);
    box-shadow: 0 0 14px rgba(228,198,111,.45);
    vertical-align: 2px;
  }

  #state {
    font-size: 20px;
    font-weight: 750;
    letter-spacing: .03em;
  }

  #det {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  #det b {
    color: var(--text);
    font-weight: 650;
  }

  /* Firmware card */

  #firmware {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 17px 18px;
    margin-bottom: 12px;

    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .fw-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .13em;
  }

  #fwValue {
    margin-top: 2px;
    font-size: 28px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: .02em;
  }

  #fwStatus {
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(105,229,154,.09);
    border: 1px solid rgba(105,229,154,.18);
    color: var(--green);
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .12em;
  }

  /* Info rows */

  .infoRow {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,.045);
  }

  .infoLabel {
    color: var(--muted);
    font-size: 12px;
  }

  .infoValue {
    font-size: 12px;
    font-weight: 650;
  }

  /* Cache */

  #cacheBox {
    margin-top: 14px;
    padding: 12px 14px;

    background: rgba(0,0,0,.18);
    border-radius: 11px;

    color: var(--muted);
    font-size: 11px;
    min-height: 18px;
  }

  #cache.cacheok {
    color: var(--green);
  }

  /* Footer */

  #footer {
    text-align: center;
    margin-top: 18px;
    color: #555e69;
    font-size: 10px;
    letter-spacing: .08em;
  }

  /* States */

  .ok {
    color: var(--green);
  }

  .bad {
    color: var(--red);
  }

  .warn {
    color: var(--yellow);
  }

  .bad #statusDot {
    background: var(--red);
    box-shadow: 0 0 14px rgba(225,125,120,.45);
  }

  .ok #statusDot {
    background: var(--green);
    box-shadow: 0 0 14px rgba(105,229,154,.55);
  }

  .warn #statusDot {
    background: var(--yellow);
    box-shadow: 0 0 14px rgba(228,198,111,.45);
  }

  /* Small screens */

  @media (max-width: 420px) {
    body {
      padding: 16px;
    }

    #logo {
      width: 72px;
      height: 72px;
      border-radius: 19px;
    }

    #title {
      font-size: 23px;
    }

    #panel {
      padding: 16px;
    }

    #fwValue {
      font-size: 25px;
    }
  }
</style>
</head>

<body>

<div id="app">

  <div id="brand">
    <img id="logo" src="logo_raw.png" alt="Z@ki OpenLine">

    <h1 id="title">《 Z@ki OpenLine 》</h1>

    <div id="subtitle">
      PS4 Offline Host
    </div>
  </div>

  <main id="panel">

    <div id="stateBox">

      <div id="state">
        <span id="statusDot"></span>
        detecting firmware...
      </div>

      <div id="det"></div>

    </div>

    <div id="firmware">

      <div>
        <div class="fw-label">PlayStation 4 Firmware</div>
        <div id="fwValue">--.--</div>
      </div>

      <div id="fwStatus">DETECTING</div>

    </div>

    <div class="infoRow">
      <span class="infoLabel">Exploit Chain</span>
      <span class="infoValue" id="bugValue">Detecting...</span>
    </div>

    <div class="infoRow">
      <span class="infoLabel">Host Mode</span>
      <span class="infoValue ok">LOCAL / OFFLINE</span>
    </div>

    <div id="cacheBox">
      <span id="cache">Checking application cache...</span>
    </div>

  </main>

  <div id="footer">
    《 Z@ki OpenLine 》 · Local PS4 Host edited By Houssam Lovy
  </div>

</div>


<script>
(function () {

    var stateEl   = document.getElementById("state");
    var detEl     = document.getElementById("det");
    var cacheEl   = document.getElementById("cache");
    var fwValue   = document.getElementById("fwValue");
    var fwStatus  = document.getElementById("fwStatus");
    var bugValue  = document.getElementById("bugValue");

    function setState(t, c) {
        stateEl.innerHTML =
            '<span id="statusDot"></span>' + t;

        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    var params = new URLSearchParams(location.search);

    var key = null;
    var fwnum = null;

    /*
     * Detect PS4 firmware from the PlayStation 4 User-Agent.
     */
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {

        var minor = parseInt(m[2], 16);

        var ms = minor.toString(16);

        if (ms.length < 2)
            ms = "0" + ms;

        key = m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    /*
     * Select exploit chain.
     */
    var bug = null;
    var why = "";

    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {

        bug = forced;

        why = "forced via ?bug=" + forced;

    } else if (!key) {

        why = "user-agent is not a PlayStation 4";

    } else if (fwnum <= 1202) {

        bug = "lapse";

        why = key + " <= 12.02";

    } else if (fwnum >= 1250) {

        bug = "poops";

        why = key + " >= 12.50";

    } else {

        why =
            key +
            " -- no working bug " +
            "(lapse ends at 12.02, poops needs 12.50)";
    }


    /*
     * Firmware display.
     */
    fwValue.textContent = key || "--.--";

    /*
     * Exploit display.
     */
    bugValue.textContent =
        bug ? bug.toUpperCase() : "UNSUPPORTED";


    /*
     * Detail line.
     */
    detEl.innerHTML =
        "Firmware <b>" +
        (key || "unknown") +
        "</b> &middot; " +
        (bug ? "Exploit <b>" + bug + "</b>" : why);


    /*
     * Unsupported firmware.
     */
    if (!bug) {

        fwStatus.textContent = "UNSUPPORTED";
        fwStatus.style.color = "var(--red)";
        fwStatus.style.borderColor = "rgba(225,125,120,.2)";
        fwStatus.style.background = "rgba(225,125,120,.07)";

        setState("UNSUPPORTED FIRMWARE", "bad");

        return;
    }


    /*
     * Supported firmware.
     */
    fwStatus.textContent = "SUPPORTED";

    var target =
        (bug === "lapse"
            ? "run_lapse.html"
            : "run_poops.html")
        + location.search;


    function go() {

        setState(
            "loading " + bug + " chain...",
            "warn"
        );

        location.replace(target);
    }


    function waitForTap(msg, action) {

        setState(msg, "warn");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }


    /*
     * Application Cache handling.
     */
    var ac = window.applicationCache;

    if (
        !ac ||
        !document.documentElement.hasAttribute("manifest")
    ) {

        setCache(
            "application cache unavailable"
        );

        setState(
            "READY",
            "ok"
        );

        go();

    } else if (!navigator.onLine) {

        setCache(
            "offline — loading from cache",
            true
        );

        setState(
            "READY",
            "ok"
        );

        go();

    } else if (ac.status === ac.IDLE) {

        setCache(
            "cached — offline ready",
            true
        );

        setState(
            "READY",
            "ok"
        );

        go();

    } else if (ac.status === ac.UPDATEREADY) {

        try {
            ac.swapCache();
        } catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        waitForTap(
            "UPDATE READY — press X or tap to reload",
            function () {
                location.reload();
            }
        );

    } else {

        setCache(
            "checking application cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {

                setCache(
                    "caching for offline (first run)..."
                );

            },
            false
        );


        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    setCache(
                        "caching " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );

                }

            },
            false
        );


        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                setState(
                    "READY",
                    "ok"
                );

                waitForTap(
                    "CACHED — press X or tap to run",
                    go
                );

            },
            false
        );


        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                waitForTap(
                    "UPDATE READY — press X or tap to reload",
                    function () {
                        location.reload();
                    }
                );

            },
            false
        );


        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "cached — offline ready",
                    true
                );

                setState(
                    "READY",
                    "ok"
                );

                go();

            },
            false
        );


        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED — press X or tap to run anyway",
                    go
                );

            },
            false
        );


        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE — press X or tap to run",
                    go
                );

            },
            false
        );

    }

})();
</script>

</body>
</html>
