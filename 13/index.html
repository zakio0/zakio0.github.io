<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>《 Z@ki OpenLine 》 PS4 Jailbreak by HoussamLovy</title>

  <style>
    :root {
      --bg: #07090c;
      --panel: rgba(15, 19, 25, .84);
      --panel2: rgba(19, 24, 31, .7);
      --border: rgba(255, 255, 255, .072);
      --text: #eef2f7;
      --muted: #87919e;
      --green: #69e59a;
      --green2: #36c978;
      --yellow: #e4c66f;
      --red: #e17d78;
      --blue: #78a9ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at 50% -15%, rgba(70, 110, 255, .14), transparent 42%),
        radial-gradient(circle at 10% 80%, rgba(50, 210, 130, .07), transparent 36%),
        var(--bg);
      color: var(--text);
      font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: hidden;
    }

    #app {
      width: min(500px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── HEADER ─────────────────────────────────── */

    #brand {
      text-align: center;
      margin-bottom: 16px;
    }

    #logo {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      margin: 0 auto 12px;
      border: 1px solid rgba(255, 255, 255, .13);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .024),
        0 14px 40px rgba(0, 0, 0, .52);
    }

    #title {
      margin: 0 0 22px;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: .04em;
    }

    #subtitle {
      margin: 0 0 22px;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: .04em;
    }

    /* ── FW BADGE IN HEADER (big glowing) ───────── */

    #fwBadge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 11px 26px;
      border-radius: 18px;
      background: rgba(105, 229, 154, .065);
      border: 1px solid rgba(105, 229, 154, .22);
      box-shadow:
        0 0 26px rgba(105, 229, 154, .16),
        0 0 52px rgba(105, 229, 154, .06),
        inset 0 1px 0 rgba(105, 229, 154, .12);
      margin-bottom: 22px;
    }

    #fwValue {
      font-size: 38px;
      font-weight: 900;
      color: var(--green);
      text-shadow:
        0 0 16px rgba(105, 229, 154, .8),
        0 0 34px rgba(105, 229, 154, .35);
      letter-spacing: .05em;
      line-height: 1;
    }

    #fwStatus {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(105, 229, 154, .10);
      border: 1px solid rgba(105, 229, 154, .24);
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-left: 25px;
    }

    #subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    /* ── MAIN PANEL ─────────────────────────────── */

    #panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 22px 65px rgba(0, 0, 0, .44),
        inset 0 1px 0 rgba(255, 255, 255, .024);
      backdrop-filter: blur(14px);
    }

    /* ── STATE BOX ──────────────────────────────── */

    #stateBox {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .013);
    }

    #state {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: .03em;
      transition: color .35s ease;
    }

    #state.ok {
      color: var(--green);
    }

    #state.bad {
      color: var(--red);
    }

    #state.warn {
      color: var(--yellow);
    }

    #statusDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--yellow);
      box-shadow: 0 0 12px rgba(228, 198, 111, .5);
      transition: background .4s ease, box-shadow .4s ease;
    }

    .bad #statusDot {
      background: var(--red);
      box-shadow: 0 0 12px rgba(225, 125, 120, .55), 0 0 24px rgba(225, 125, 120, .25);
    }

    .ok #statusDot {
      background: var(--green);
      box-shadow: 0 0 12px rgba(105, 229, 154, .65), 0 0 24px rgba(105, 229, 154, .28);
    }

    .warn #statusDot {
      background: var(--yellow);
      box-shadow: 0 0 12px rgba(228, 198, 111, .55);
    }

    #det {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      padding-left: 19px;
    }

    #det b {
      color: var(--text);
      font-weight: 650;
    }

    /* ── INFO ROWS ──────────────────────────────── */

    .infoRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .042);
    }

    .infoLabel {
      color: var(--muted);
      font-size: 12px;
    }

    .infoValue {
      font-size: 12px;
      font-weight: 650;
    }

    .ok {
      color: var(--green);
    }

    .bad {
      color: var(--red);
    }

    /* ── CACHE BOX ──────────────────────────────── */

    #cacheBox {
      padding: 11px 18px;
      color: var(--muted);
      font-size: 11px;
      min-height: 16px;
    }

    #cache.cacheok {
      color: var(--green);
    }

    /* ── FOOTER ─────────────────────────────────── */

    #footer {
      text-align: center;
      margin-top: 14px;
      color: #4a5560;
      font-size: 9px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    /* ── SMALL SCREENS ──────────────────────────── */

    @media (max-width: 420px) {
      body {
        padding: 14px;
      }

      #logo {
        width: 62px;
        height: 62px;
        border-radius: 17px;
      }

      #title {
        font-size: 21px;
      }

      #fwBadge {
        padding: 9px 18px;
        gap: 10px;
      }

      #fwValue {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- Header: logo + title + big glowing FW badge + subtitle -->
    <div id="brand">
      <img id="logo" src="logo_raw.png" alt="Z@ki OpenLine">

      <h1 id="title">《 Z@ki OpenLine 》</h1>

      <div id="fwBadge">
        <div id="fwValue">--.--</div>
        <div id="fwStatus">DETECTING</div>
      </div>

      <div id="subtitle">PS4 Offline Host &middot; edited by Houssam Lovy</div>
    </div>


    <main id="panel">

      <!-- State -->
      <div id="stateBox">
        <div id="state">
          <span id="statusDot"></span>
          detecting firmware...
        </div>
        <div id="det"></div>
      </div>

      <!-- Info rows -->
      <div class="infoRow">
        <span class="infoLabel">Exploit Chain</span>
        <span class="infoValue" id="bugValue">Detecting...</span>
      </div>

      <div class="infoRow">
        <span class="infoLabel">Host Mode</span>
        <span class="infoValue ok">LOCAL / OFFLINE</span>
      </div>

      <!-- Cache status -->
      <div id="cacheBox">
        <span id="cache">Checking application cache...</span>
      </div>

    </main>


    <div id="footer">
      《 Z@ki OpenLine 》 &middot; Local PS4 Host edited By Houssam Lovy
    </div>

  </div>


  <script>
    (function () {

      var stateEl = document.getElementById("state");
      var detEl = document.getElementById("det");
      var cacheEl = document.getElementById("cache");
      var fwValue = document.getElementById("fwValue");
      var fwStatus = document.getElementById("fwStatus");
      var bugValue = document.getElementById("bugValue");

      function setState(t, c) {
        stateEl.innerHTML =
          '<span id="statusDot"></span>' + t;

        stateEl.className = c || "";
      }

      function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
      }

      var params = new URLSearchParams(location.search);

      var key = null;
      var fwnum = null;

      /*
       * Detect PS4 firmware from the PlayStation 4 User-Agent.
       */
      var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

      if (m) {

        var minor = parseInt(m[2], 16);

        var ms = minor.toString(16);

        if (ms.length < 2)
          ms = "0" + ms;

        key = m[1] + "." + ms;

        fwnum =
          parseInt(m[1], 10) * 100 +
          parseInt(ms, 10);
      }

      /*
       * Select exploit chain.
       */
      var bug = null;
      var why = "";

      var forced = params.get("bug");

      if (forced === "lapse" || forced === "poops") {

        bug = forced;

        why = "forced via ?bug=" + forced;

      } else if (!key) {

        why = "user-agent is not a PlayStation 4";

      } else if (fwnum <= 1202) {

        bug = "lapse";

        why = key + " <= 12.02";

      } else if (fwnum >= 1250) {

        bug = "poops";

        why = key + " >= 12.50";

      } else {

        why =
          key +
          " -- no working bug " +
          "(lapse ends at 12.02, poops needs 12.50)";
      }


      /*
       * Firmware display.
       */
      fwValue.textContent = key || "--.--";

      /*
       * Exploit display.
       */
      bugValue.textContent =
        bug ? bug.toUpperCase() : "UNSUPPORTED";


      /*
       * Detail line.
       */
      detEl.innerHTML =
        "Firmware <b>" +
        (key || "unknown") +
        "</b> &middot; " +
        (bug ? "Exploit <b>" + bug + "</b>" : why);


      /*
       * Unsupported firmware.
       */
      if (!bug) {

        fwStatus.textContent = "UNSUPPORTED";
        fwStatus.style.color = "var(--red)";
        fwStatus.style.borderColor = "rgba(225,125,120,.2)";
        fwStatus.style.background = "rgba(225,125,120,.07)";

        setState("UNSUPPORTED FIRMWARE", "bad");

        return;
      }


      /*
       * Supported firmware.
       */
      fwStatus.textContent = "SUPPORTED";

      var target =
        (bug === "lapse"
          ? "run_lapse.html"
          : "run_poops.html")
        + location.search;


      function go() {

        setState(
          "loading " + bug + " chain...",
          "warn"
        );

        location.replace(target);
      }


      function waitForTap(msg, action) {

        setState(msg, "warn");

        var completed = false;

        function fire() {

          if (completed)
            return;

          completed = true;

          window.removeEventListener(
            "click",
            fire
          );

          window.removeEventListener(
            "keydown",
            fire
          );

          action();
        }

        window.addEventListener(
          "click",
          fire
        );

        window.addEventListener(
          "keydown",
          fire
        );

        window.setTimeout(
          fire,
          2000
        );
      }


      /*
       * Application Cache handling.
       */
      var ac = window.applicationCache;

      if (
        !ac ||
        !document.documentElement.hasAttribute("manifest")
      ) {

        setCache(
          "application cache unavailable"
        );

        setState(
          "READY",
          "ok"
        );

        go();

      } else if (!navigator.onLine) {

        setCache(
          "offline — loading from cache",
          true
        );

        setState(
          "READY",
          "ok"
        );

        go();

      } else if (ac.status === ac.IDLE) {

        setCache(
          "cached — offline ready",
          true
        );

        setState(
          "READY",
          "ok"
        );

        go();

      } else if (ac.status === ac.UPDATEREADY) {

        try {
          ac.swapCache();
        } catch (e) { }

        setCache(
          "update downloaded",
          true
        );

        waitForTap(
          "UPDATE READY — press X or tap to reload",
          function () {
            location.reload();
          }
        );

      } else {

        setCache(
          "checking application cache..."
        );

        ac.addEventListener(
          "downloading",
          function () {

            setCache(
              "caching for offline (first run)..."
            );

          },
          false
        );


        ac.addEventListener(
          "progress",
          function (e) {

            if (e && e.total) {

              setCache(
                "caching " +
                Math.round(
                  (e.loaded / e.total) * 100
                ) +
                "%"
              );

            }

          },
          false
        );


        ac.addEventListener(
          "cached",
          function () {

            setCache(
              "cached for offline use",
              true
            );

            setState(
              "READY",
              "ok"
            );

            waitForTap(
              "CACHED — press X or tap to run",
              go
            );

          },
          false
        );


        ac.addEventListener(
          "updateready",
          function () {

            try {
              ac.swapCache();
            } catch (e) { }

            setCache(
              "update downloaded",
              true
            );

            waitForTap(
              "UPDATE READY — press X or tap to reload",
              function () {
                location.reload();
              }
            );

          },
          false
        );


        ac.addEventListener(
          "noupdate",
          function () {

            setCache(
              "cached — offline ready",
              true
            );

            setState(
              "READY",
              "ok"
            );

            go();

          },
          false
        );


        ac.addEventListener(
          "error",
          function () {

            setCache(
              "cache unavailable"
            );

            waitForTap(
              "CACHE FAILED — press X or tap to run anyway",
              go
            );

          },
          false
        );


        ac.addEventListener(
          "obsolete",
          function () {

            setCache(
              "cache obsolete"
            );

            waitForTap(
              "CACHE OBSOLETE — press X or tap to run",
              go
            );

          },
          false
        );

      }

    })();
  </script>

</body>

</html>
