<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>《 Z@ki OpenLine 》 — Poops chain </title>

<style>
  :root {
    --bg: #07090c;
    --panel: rgba(14, 18, 24, .88);
    --border: rgba(255,255,255,.075);
    --text: #edf1f6;
    --muted: #7f8996;
    --green: #69e59a;
    --yellow: #e4c66f;
    --red: #e17d78;
    --console: #090c10;
    --console-border: #202a35;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;

    background:
      radial-gradient(
        circle at 50% -15%,
        rgba(70, 110, 255, .12),
        transparent 45%
      ),
      radial-gradient(
        circle at 5% 90%,
        rgba(50, 210, 130, .055),
        transparent 35%
      ),
      var(--bg);

    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 18px;
  }

  #app {
    width: min(980px, 100%);
    margin: 0 auto;
  }

  /* ─────────────────────────────
     BRAND
     ───────────────────────────── */

  #brand {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 10px 4px 18px;
  }

  #brand img {
    width: 68px;
    height: 68px;

    object-fit: cover;
    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.11);

    box-shadow:
      0 8px 28px rgba(0,0,0,.45);
  }

  #brandText {
    min-width: 0;
  }

  #brandTitle {
    margin: 0;

    font-size: 19px;
    font-weight: 760;
    letter-spacing: .055em;

    color: #eef2f7;
  }

  #brandSub {
    margin-top: 2px;

    color: var(--muted);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  /* ─────────────────────────────
     MAIN PANEL
     ───────────────────────────── */

  #panel {
    overflow: hidden;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 18px;

    box-shadow:
      0 25px 80px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.025);

    backdrop-filter: blur(14px);
  }

  /* ─────────────────────────────
     STATUS BAR
     ───────────────────────────── */

  #statusBar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 17px;

    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.018);
  }

  #stateWrap {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  #statusDot {
    width: 9px;
    height: 9px;

    flex: 0 0 auto;

    margin-right: 9px;

    border-radius: 50%;

    background: var(--yellow);

    box-shadow:
      0 0 14px rgba(228,198,111,.5);
  }

  #state {
    font-size: 16px;
    font-weight: 720;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #chainBadge {
    padding: 5px 10px;

    border-radius: 999px;

    color: var(--green);
    background: rgba(105,229,154,.07);

    border: 1px solid rgba(105,229,154,.16);

    font-size: 9px;
    font-weight: 750;
    letter-spacing: .12em;

    flex: 0 0 auto;
  }

  /* ─────────────────────────────
     CONSOLE HEADER
     ───────────────────────────── */

  #consoleHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 9px 13px;

    background: #0d1116;

    border-bottom: 1px solid var(--console-border);
  }

  #consoleTitle {
    color: #9ba5b1;

    font: 11px/1 Consolas, "Courier New", monospace;
    letter-spacing: .08em;
  }

  #consoleStatus {
    color: #56616d;

    font: 10px/1 Consolas, "Courier New", monospace;
  }

  /* ─────────────────────────────
     CONSOLE
     ───────────────────────────── */

  #console {
    position: relative;
    padding: 12px;
    background: var(--console);
  }

  #out {
    white-space: pre-wrap;
    word-break: break-word;

    font:
      12px/1.5
      Consolas,
      "Courier New",
      monospace;

    color: #c8d0d9;

    background:
      linear-gradient(
        rgba(255,255,255,.012) 1px,
        transparent 1px
      );

    background-size: 100% 3px;

    border: 1px solid var(--console-border);
    border-radius: 10px;

    padding: 13px 14px;

    height: calc(100vh - 205px);
    min-height: 330px;

    overflow-y: auto;

    box-shadow:
      inset 0 0 35px rgba(0,0,0,.3);
  }

  /* ─────────────────────────────
     SCROLLBAR
     ───────────────────────────── */

  #out::-webkit-scrollbar {
    width: 7px;
  }

  #out::-webkit-scrollbar-track {
    background: transparent;
  }

  #out::-webkit-scrollbar-thumb {
    background: #29333e;
    border-radius: 10px;
  }

  /* ─────────────────────────────
     FOOTER
     ───────────────────────────── */

  #footer {
    text-align: center;

    padding: 13px 0 3px;

    color: #4e5864;

    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* ─────────────────────────────
     STATES
     ───────────────────────────── */

  .ok {
    color: var(--green);
  }

  .bad {
    color: var(--red);
  }

  .warn {
    color: var(--yellow);
  }

  .state-ok #statusDot {
    background: var(--green);
    box-shadow:
      0 0 14px rgba(105,229,154,.6);
  }

  .state-bad #statusDot {
    background: var(--red);
    box-shadow:
      0 0 14px rgba(225,125,120,.5);
  }

  .state-warn #statusDot {
    background: var(--yellow);
    box-shadow:
      0 0 14px rgba(228,198,111,.5);
  }

  /* ─────────────────────────────
     MOBILE
     ───────────────────────────── */

  @media (max-width: 600px) {

    body {
      padding: 10px;
    }

    #brand {
      padding-bottom: 13px;
    }

    #brand img {
      width: 42px;
      height: 42px;
    }

    #brandTitle {
      font-size: 16px;
    }

    #panel {
      border-radius: 14px;
    }

    #statusBar {
      padding: 12px;
    }

    #state {
      font-size: 14px;
    }

    #chainBadge {
      padding: 4px 7px;
    }

    #out {
      height: calc(100vh - 190px);
      min-height: 280px;
      font-size: 11px;
    }
  }
</style>
</head>

<body>

<div id="app">

  <!-- Z@ki OpenLine branding -->
  <header id="brand">

    <img
      src="logo_raw.png"
      alt="Z@ki OpenLine"
    >

    <div id="brandText">

      <h1 id="brandTitle">
        《 Z@ki OpenLine 》
      </h1>

      <div id="brandSub">
        PS4 Poops Exploit Host .edited by Houssam Lovy.
      </div>

    </div>

  </header>


  <main id="panel">

    <!-- Status -->
    <div id="statusBar">

      <div id="stateWrap">

        <span id="statusDot"></span>

        <div id="state">
          loading poops chain...
        </div>

      </div>

      <div id="chainBadge">
        POOPS
      </div>

    </div>


    <!-- Console header -->
    <div id="consoleHeader">

      <div id="consoleTitle">
        Z@ki //Loading Poops chain...
      </div>

      <div id="consoleStatus">
        LIVE
      </div>

    </div>


    <!-- Existing console output -->
    <div id="console">

      <div id="out"></div>

    </div>

  </main>


  <footer id="footer">
    《 Z@ki OpenLine 》 · Local PS4 Host edited by Houssam Lovy
  </footer>

</div>


<script type="module">
  import "./chain_poops.js";
</script>

</body>
</html>
