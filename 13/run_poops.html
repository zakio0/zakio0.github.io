<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>《 Z@ki OpenLine 》 — Poops chain</title>

  <style>
    :root {
      --bg: #07090c;
      --panel: rgba(14, 18, 24, .9);
      --border: rgba(255, 255, 255, .07);
      --text: #edf1f6;
      --muted: #7f8996;
      --green: #69e59a;
      --yellow: #e4c66f;
      --red: #e17d78;
      --console: #060a0e;
      --console-border: #1a2230;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% -15%, rgba(70,110,255,.12), transparent 45%),
        radial-gradient(circle at 5% 90%,  rgba(50,210,130,.055), transparent 35%),
        var(--bg);
      color: var(--text);
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    body {
      height: 100vh;
      padding: 14px 18px;
      overflow: hidden;
    }

    #app {
      width: min(980px, 100%);
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ── BRAND ─────────────────────────────────── */

    #brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 0 12px;
      flex: 0 0 auto;
    }

    #brand img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 23px;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 6px 22px rgba(0,0,0,.44);
      flex: 0 0 auto;
    }

    #brandText {
      flex: 1;
      min-width: 0;
    }

    #brandTitle {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .05em;
      color: #eef2f7;
      white-space: nowrap;
    }

    #brandSub {
      margin-top: 3px;
      margin-left: 30px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: .09em;
    }

    /* ── FW BADGE IN HEADER (big glowing) ───────── */

    #fwWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      padding: 9px 22px;
      border-radius: 16px;
      background: rgba(105,229,154,.065);
      border: 1px solid rgba(105,229,154,.24);
      box-shadow:
        0 0 22px rgba(105,229,154,.16),
        0 0 44px rgba(105,229,154,.06),
        inset 0 1px 0 rgba(105,229,154,.12);
    }

    .fw-lbl {
      font-size: 15px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    #firmware {
      font-size: 28px;
      font-weight: 900;
      color: var(--green);
      text-shadow:
        0 0 14px rgba(105,229,154,.8),
        0 0 30px rgba(105,229,154,.35);
      letter-spacing: .06em;
      line-height: 1;
    }

    /* ── PANEL ──────────────────────────────────── */

    #panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1 1 auto;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.022);
      backdrop-filter: blur(14px);
    }

    /* ── STATUS BAR ─────────────────────────────── */

    #statusBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.015);
      flex: 0 0 auto;
      transition:
        background .45s ease,
        border-color .45s ease,
        box-shadow .45s ease;
    }

    /* ✅ SUCCESS — full bar turns green */
    #statusBar.status-ok {
      background: linear-gradient(135deg,
        rgba(28,155,76,.30) 0%,
        rgba(45,195,105,.16) 100%);
      border-bottom-color: rgba(105,229,154,.48);
      box-shadow: 0 4px 32px rgba(105,229,154,.18);
    }

    /* ❌ FAILED — full bar turns red */
    #statusBar.status-bad {
      background: linear-gradient(135deg,
        rgba(175,38,38,.30) 0%,
        rgba(215,58,58,.16) 100%);
      border-bottom-color: rgba(225,125,120,.48);
      box-shadow: 0 4px 32px rgba(225,125,120,.18);
    }

    #stateWrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    #statusDot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 12px rgba(228,198,111,.55);
      transition: background .45s ease, box-shadow .45s ease;
    }

    /* dot color  */
    #statusBar.status-ok #statusDot {
      background: var(--green);
      box-shadow: 0 0 10px rgba(105,229,154,.95), 0 0 24px rgba(105,229,154,.45);
    }

    #statusBar.status-bad #statusDot {
      background: var(--red);
      box-shadow: 0 0 10px rgba(225,125,120,.95), 0 0 24px rgba(225,125,120,.45);
    }

    #state {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .35s ease;
    }

    #statusBar.status-ok  #state { color: var(--green); }
    #statusBar.status-bad #state { color: var(--red);   }

    #chainBadge {
      padding: 5px 13px;
      border-radius: 999px;
      color: var(--green);
      background: rgba(105,229,154,.07);
      border: 1px solid rgba(105,229,154,.18);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      flex: 0 0 auto;
    }

    /* ── CONSOLE HEADER ─────────────────────────── */

    #consoleHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #0b0f14;
      border-bottom: 1px solid var(--console-border);
      flex: 0 0 auto;
    }

    #consoleTitle {
      color: #8a96a3;
      font: 11px/1 Consolas, "Courier New", monospace;
      letter-spacing: .07em;
    }

    #consoleStatus {
      color: #444f5c;
      font: 10px/1 Consolas, "Courier New", monospace;
    }

    /* ── CONSOLE OUTPUT ─────────────────────────── */

    #console {
      position: relative;
      padding: 10px;
      background: var(--console);
      flex: 1 1 auto;
      min-height: 0;
    }

    #out {
      height: 100%;
      min-height: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.5 Consolas, "Courier New", monospace;
      color: #00ff00;
      background: linear-gradient(rgba(255,255,255,.009) 1px, transparent 1px);
      background-size: 100% 3px;
      border: 1px solid var(--console-border);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-y: auto;
      box-shadow: inset 0 0 35px rgba(0,0,0,.38);
    }

    #out::-webkit-scrollbar       { width: 6px; }
    #out::-webkit-scrollbar-track { background: transparent; }
    #out::-webkit-scrollbar-thumb { background: #22303e; border-radius: 10px; }

    /* ── FOOTER ─────────────────────────────────── */

    #footer {
      text-align: center;
      padding: 9px 0 0;
      color: #3e4c59;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      flex: 0 0 auto;
    }

    .ok   { color: var(--green);  }
    .bad  { color: var(--red);    }
    .warn { color: var(--yellow); }
  </style>
</head>

<body>

  <div id="app">

    <!-- Z@ki OpenLine branding -->
    <header id="brand">

      <img src="logo_raw.png" alt="Z@ki OpenLine">

      <div id="brandText">
        <h1 id="brandTitle">《 Z@ki OpenLine 》</h1>
        <div id="brandSub">PS4 Poops Exploit Host <br> edited by Houssam Lovy</div>
      </div>

      <!-- FW version badge — moved here from status bar, big + glowing -->
      <div id="fwWrap">
        <span class="fw-lbl">PS4 &nbsp;FW</span>
        <span id="firmware">--.--</span>
      </div>

    </header>


    <main id="panel">

      <!-- Status bar -->
      <div id="statusBar">

        <div id="stateWrap">
          <span id="statusDot"></span>
          <div id="state">loading poops chain...</div>
        </div>

        <div id="chainBadge">POOPS</div>

      </div>


      <!-- Console header -->
      <div id="consoleHeader">
        <div id="consoleTitle">Z@ki //Loading Poops chain...</div>
        <div id="consoleStatus">LIVE</div>
      </div>


      <!-- Console output -->
      <div id="console">
        <div id="out"></div>
      </div>

    </main>


    <footer id="footer">
      《 Z@ki OpenLine 》 · Local PS4 Host edited by Houssam Lovy
    </footer>

  </div>


  <script type="module">
    const statusBar = document.getElementById("statusBar");
    const output = document.getElementById("out");
    const state = document.getElementById("state");
    const firmware = document.getElementById("firmware");

    const m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
      const minor = parseInt(m[2], 16);
      const ms = minor.toString(16).padStart(2, "0");

      firmware.textContent = m[1] + "." + ms;
    }

    function updateStatusBar() {
      const text = output.textContent + " " + state.textContent;
      const rebootRequired = /FAILED|REBOOT/i.test(text);
      const succeeded = /PAYLOAD-RUNNING|JAILBROKEN|ALL DONE/i.test(text);

      statusBar.classList.toggle("status-bad", rebootRequired);
      statusBar.classList.toggle("status-ok", succeeded);
    }

    new MutationObserver(updateStatusBar).observe(output, {
      childList: true,
      subtree: true,
      characterData: true
    });
    new MutationObserver(updateStatusBar).observe(state, {
      childList: true,
      characterData: true
    });

    import "./chain_poops.js";
  </script>

</body>

</html>
