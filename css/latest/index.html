<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaki OpenLine // PS4 6.00–11.02 / GoldHEN v2.4b18.13</title>
  <link rel="icon" type="image/png" href="../../logo.png">
  <style>
    :root {
      --bg: #050508;
      --panel: #080b10;
      --panel-2: #0d1218;
      --line: #15202e;
      --line-h: #1c2e42;
      --text: #d8e8f4;
      --muted: #6a86a0;
      --dim: #384858;
      --accent: #0098e8;
      --glow: #00cfff;
      --glow2: #005a9e;
      --green: #00df88;
      --red: #ff5555;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: Consolas, "DejaVu Sans Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background .5s;
    }
    body.jb-success { background: #001a0a; }
    a { color: var(--accent); }

    .app {
      display: flex;
      flex-direction: column;
      flex: 1;
      margin: 0 auto;
      max-width: 900px;
      padding: 0 16px 20px;
      width: 100%;
    }

    /* ── Header ─────────────────────────────────────────── */
    .zol-hd {
      align-items: center;
      border-bottom: 1px solid var(--line-h);
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
    }
    .zol-brand { align-items: center; display: flex; gap: 10px; }
    .zol-logo { border-radius: 50%; height: 44px; object-fit: cover; width: 44px; }
    .zol-name { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .03em; line-height: 1.1; }
    .zol-name em { color: var(--glow); font-style: normal; }
    .zol-sub { color: var(--muted); font-size: 11px; letter-spacing: .1em; margin-top: 2px; text-transform: uppercase; }
    .zol-fw { text-align: right; }
    .zol-fw-lbl { color: var(--muted); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
    .zol-fw-num {
      color: var(--glow);
      font: 900 46px/1 var(--sans);
      letter-spacing: -1px;
      text-shadow: 0 0 20px var(--accent), 0 0 42px var(--glow2);
    }

    /* ── Info pills ─────────────────────────────────────── */
    .zol-info {
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px 0;
    }
    .pill {
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line-h);
      border-radius: 3px;
      color: var(--muted);
      display: inline-flex;
      font-size: 12px;
      gap: 5px;
      padding: 3px 9px;
    }
    .pill .dot { background: var(--accent); border-radius: 50%; flex-shrink: 0; height: 6px; width: 6px; }
    .pill .dg  { background: var(--green); }

    /* ── Step ───────────────────────────────────────────── */
    .zol-step {
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line-h);
      border-left: 3px solid var(--accent);
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 14px;
      transition: border-left-color .4s;
    }
    body.jb-success .zol-step { border-left-color: var(--green); }
    .step-ic { color: var(--accent); flex-shrink: 0; }
    #autoJbLabel { color: var(--text); font-size: 14px; }

    /* ── Debug log (#console) ───────────────────────────── */
    .log-wrap { margin-top: 10px; }
    .sec-lbl { color: var(--muted); font-size: 11px; letter-spacing: .15em; margin-bottom: 5px; text-transform: uppercase; }
    /* script.js needs: textContent append, scrollTop, overflow:auto, pre-wrap */
    #console {
      background: var(--panel-2);
      border: 1px solid var(--line-h);
      color: var(--text);
      font: 13px/1.45 var(--mono);
      max-height: 160px;
      min-height: 48px;
      overflow-y: auto;
      padding: 10px 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Cache / UA status ──────────────────────────────── */
    .zol-meta { color: var(--muted); display: flex; flex-wrap: wrap; font-size: 12px; gap: 4px 14px; margin-top: 7px; }
    #UA  { color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
    #cache { color: var(--dim); font-size: 12px; }
    #cache.cacheok { color: var(--green); }

    /* ── Success block ──────────────────────────────────── */
    #zol-done {
      align-items: center;
      display: none;
      flex-direction: column;
      justify-content: center;
      margin-top: 14px;
      padding: 28px 16px;
      text-align: center;
      border: 1px solid var(--green);
      background: rgba(0,180,80,.07);
    }
    body.jb-success #zol-done { display: flex; }
    .done-ic {
      color: var(--green);
      font-size: 70px;
      line-height: 1;
      text-shadow: 0 0 40px var(--green);
    }
    .done-txt {
      color: var(--green);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-top: 10px;
      text-shadow: 0 0 22px var(--green);
    }
    .done-sub { color: var(--muted); font-size: 13px; margin-top: 8px; }

    /* ── Controls ───────────────────────────────────────── */
    .zol-controls { border: 1px solid var(--line-h); margin-top: 14px; padding: 14px; }
    #kernel-options { align-items: center; display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .chain-label { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .chain-options { display: flex; gap: 6px; }
    #kernel-options input[type="radio"] { height: 1px; opacity: 0; position: absolute; width: 1px; }
    .chain-option, #jeilbrek, #reloadBtn, .auto-jb-label {
      background: var(--panel);
      border: 1px solid var(--line-h);
      color: var(--text);
      cursor: pointer;
      font: 13px/1.3 var(--sans);
      min-height: 40px;
      padding: 8px 14px;
    }
    #kernel-options input[type="radio"]:checked + .chain-option,
    .chain-option:hover, #jeilbrek:hover, #jeilbrek:focus,
    #reloadBtn:hover, #reloadBtn:focus, .auto-jb-label:hover {
      background: var(--panel-2);
      border-color: var(--accent);
      color: var(--glow);
      outline: 0;
    }
    #kernel-options input[type="radio"]:focus + .chain-option,
    #jeilbrek:focus, #reloadBtn:focus {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }
    #jeilbrek:disabled { cursor: wait; opacity: .5; }
    .auto-jb { align-items: center; display: flex; gap: 6px; }
    .auto-jb-label { align-items: center; display: flex; font-size: 13px; }
    #autoJbInput { height: 16px; width: 16px; }

    /* ── Footer ─────────────────────────────────────────── */
    .zol-foot { color: var(--dim); font-size: 12px; margin-top: auto; padding: 14px 0 2px; text-align: center; }
    .zol-foot a { color: var(--muted); }
    .zol-foot a:hover { color: var(--glow); }

    @media (max-width: 600px) {
      .zol-fw-num { font-size: 34px; }
      #kernel-options { flex-direction: column; align-items: flex-start; }
      .chain-options { width: 100%; }
      .chain-option { flex: 1; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="zol-hd">
      <div class="zol-brand">
        <img class="zol-logo" src="../../logo.png" alt="">
        <div>
          <div class="zol-name">Zaki <em>OpenLine</em></div>
          <div class="zol-sub">PS4 Jailbreak Host</div>
        </div>
      </div>
      <div class="zol-fw">
        <div class="zol-fw-lbl">FIRMWARE</div>
        <div class="zol-fw-num" id="zol-fw-ver">—</div>
      </div>
    </header>

    <div class="zol-info">
      <span class="pill"><span class="dot"></span>CSSFontFace</span>
      <span class="pill"><span class="dot dg"></span>GoldHEN v2.4b18.13</span>
      <span class="pill">FW 6.00–11.02</span>
    </div>

    <div class="zol-step">
      <span class="step-ic">▶</span>
      <label id="autoJbLabel" for="autoJbInput">Auto Jailbreak</label>
    </div>

    <div class="log-wrap">
      <div class="sec-lbl">Debug Log</div>
      <pre id="console">Ready. Awaiting execution...</pre>
    </div>

    <div class="zol-meta">
      <span id="UA">Running on:</span>
      <span id="cache">Checking offline cache...</span>
    </div>

    <!-- Success block -->
    <div id="zol-done" role="status" aria-live="assertive">
      <div class="done-ic">✓</div>
      <div class="done-txt">ALL DONE</div>
      <div class="done-sub">GoldHEN v2.4b18.13 loaded successfully</div>
    </div>

    <div class="zol-controls">
      <div class="sec-lbl">Exploit Control</div>
      <form id="kernel-options">
        <span class="chain-label">Kernel chain</span>
        <div class="chain-options">
          <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
          <label class="chain-option" for="netctrl-exploit">Poops</label>
          <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
          <label class="chain-option" for="lapse-exploit">Lapse</label>
        </div>
        <button id="jeilbrek" type="button">Jailbreak</button>
        <button id="reloadBtn" type="button">Reload</button>
        <div class="auto-jb">
          <label class="auto-jb-label" for="autoJbInput">Auto</label>
          <input id="autoJbInput" type="checkbox">
        </div>
      </form>
    </div>

    <footer class="zol-foot">by <a href="https://t.me/PlayStation_Pulse">PlayStation Pulse</a></footer>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>

  <script>
    /* AppCache status display */
    (function () {
      var cache = window.applicationCache;
      var status = document.getElementById('cache');
      function show(msg, ok) {
        if (status) { status.textContent = msg; status.className = ok ? 'cacheok' : ''; }
      }
      if (!cache || !document.documentElement.hasAttribute('manifest')) {
        show('Application cache unavailable'); return;
      }
      cache.addEventListener('checking',    function () { show('Checking offline cache...'); }, false);
      cache.addEventListener('downloading', function () { show('Installing offline cache...'); }, false);
      cache.addEventListener('progress',    function (e) { if (e && e.total > 0) show('Caching ' + Math.round(e.loaded / e.total * 100) + '%'); }, false);
      cache.addEventListener('cached',      function () { show('Cached for offline use', true); }, false);
      cache.addEventListener('noupdate',    function () { show('Cached — offline ready', true); }, false);
      cache.addEventListener('updateready', function () { show('Cache updated — reloading...', true); try { cache.swapCache(); } catch(e){} setTimeout(function(){ location.reload(); }, 800); }, false);
      cache.addEventListener('error', function () {
        if (cache.status === cache.IDLE || cache.status === cache.UPDATEREADY) show('Cached — offline ready', true);
        else show('Cache failed — check connection');
      }, false);
      cache.addEventListener('obsolete', function () { show('Cache obsolete — clear browser data and reload'); }, false);
      if (!navigator.onLine) show('Offline — using cache', true);
      else if (cache.status === cache.UPDATEREADY) show('Cache updated — reloading...', true);
      else if (cache.status === cache.IDLE) show('Cached — offline ready', true);
    }());

    /* FW badge — parse PS4 FW directly from UA */
    (function () {
      var badge = document.getElementById('zol-fw-ver');
      if (!badge) return;
      var m = navigator.userAgent.match(/PlayStation\s*4[\s\/](\d+\.\d+)/i);
      if (m) badge.textContent = m[1];
    }());

    /* Success detection — watch #autoJbLabel for "Completed" */
    (function () {
      var lbl = document.getElementById('autoJbLabel');
      if (!lbl || !window.MutationObserver) return;
      var ob = new MutationObserver(function () {
        if (lbl.textContent === 'Completed') {
          document.body.classList.add('jb-success');
          ob.disconnect();
        }
      });
      ob.observe(lbl, { childList: true, subtree: true, characterData: true });
    }());
  </script>
</body>
</html>
